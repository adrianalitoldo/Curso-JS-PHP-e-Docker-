<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mínimo de Estoque</title>
</head>

<body>

    <h1>Calcular Mínimo de Estoque</h1>

    <label>Quantidade mínima:</label>
    <input type="number" id="quantidade_minima" step="0.01">

    <br><br>

    <label>Quantidade máxima:</label>
    <input type="number" id="quantidade_maxima" step="0.01">

    <br><br>

    <button onclick="calcularEstoque()">Calcular</button>

    <script>
        async function calcularEstoque() {

            const quantidade_minima =
                document.getElementById("quantidade_minima").value;

            const quantidade_maxima =
                document.getElementById("quantidade_maxima").value;

            const resposta = await fetch(
                "http://localhost:5000/calculo_estoque",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        quantidade_minima: quantidade_minima,
                        quantidade_maxima: quantidade_maxima
                    })
                }
            );

            const dados = await resposta.json();

            if (resposta.ok) {
                alert(
                    "Quantidade média de estoque: " +
                    dados.quantidade_media
                );
            } else {
                alert("Erro: " + dados.mensagem);
            }
        }
    </script>

</body>
</html>
