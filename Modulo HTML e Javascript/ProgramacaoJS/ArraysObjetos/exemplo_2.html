<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 2 - Objetos</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="header-main">
        <a href="index.html">
            <h1>Lógica de programação com Javascript</h1>
        </a>
    </header>

    <main class="main-content">
        <h2>Exemplo 2 - Objetos</h2>

        <div class="form-group">
            <label for="nome_completo">Nome completo</label>
            <input type="text" id="nome_completo" placeholder="Digite seu nome aqui...">
        </div>

        <div class="form-group">
            <label for="idade_usuario">Idade</label>
            <input type="text" id="idade_usuario" placeholder="Digite sua idade aqui...">
        </div>

        <div class="form-group">
            <label for="rua_usuario">Sua rua</label>
            <input type="text" id="rua_usuario" placeholder="Digite o nome da sua rua aqui...">
        </div>
        <p id="msg_exibir"></p>

        <button type="submit" id="btn_exibir" class="btn success">Exibir</button>
        <button type="submit" id="btn_add" class="btn success">Adicionar</button>

        <hr>
    </main>

    <Script>

        const btnExibir = document.getElementById("btn_exibir")
        const btnAdd = document.getElementById("btn_add")
        const nomeInput = document.getElementById("nome_completo")
        const idadeInput = document.getElementById("idade_usuario")
        const ruaInput = document.getElementById("rua_usuario")

        const msg = document.getElementById("msg_exibir")
        let pessoa = {}



        btnAdd.addEventListener("click", () => {
            pessoa = {
                nome: nomeInput.value,
                idade: idadeInput.value,
                rua: ruaInput.value
            }

            nomeInput.value = "";
            idadeInput.value = "";
            ruaInput.value = "";


            console.log(pessoa)
        })



        btnExibir.addEventListener("click", () => {
            msg.innerHTML = `Nome: ${pessoa.nome}, sua idade é: ${pessoa.idade} anos, 
            e sua rua é: ${pessoa.rua}.`


        })




    </Script>

</body>

</html>
