<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 1 -Arrays</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="header-main">
        <a href="index.html">
            <h1>Lógica de programação com Javascript</h1>
        </a>
    </header>

    <main class="main-content">
        <h2>Exemplo 1 - Arrays</h2>

        <div class="form-group">
            <label for="nome_completo">Nome completo</label>
            <input type="text" id="nome_completo" placeholder="Digite seu nome aqui...">
        </div>

        <div class="form-group">
            <label for="idade_usuario">Idade</label>
            <input type="text" id="idade_usuario" placeholder="Digite sua idade aqui...">
        </div>

        <p id="msg_exibir"></p>

        <button type="submit" id="btn_exibir" class="btn success">Exibir</button>
        <button type="submit" id="btn_add" class="btn success">Adicionar</button>
        <button type="submit" id="btn_exibir_maior18" class="btn success">Exibir maior que 18 anos</button>

        <hr>
    </main>

    <Script>

        const btnExibir = document.getElementById("btn_exibir")
        const btnAdd = document.getElementById("btn_add")
        const nomeInput = document.getElementById("nome_completo")
        const idadeInput = document.getElementById("idade_usuario")
        const btnExibir18 = document.getElementById("btn_exibir_maior18")

        const msg = document.getElementById("msg_exibir")

        let nomes = []
        let idades = []



        btnAdd.addEventListener("click", () => {
            nomes.push(nomeInput.value)
            nomeInput.value = ""

            idades.push(idadeInput.value)
            idadeInput.value = ""
            nomeInput.focus()

        })

    
        btnExibir.addEventListener("click", () => {
            let nomesExibir = ""

            for (let i = 0; i < nomes.length; i++) {
                nomesExibir = `${nomesExibir} <br> ${nomes[i]}, idade ${idades[i]}`
            }

            msg.innerHTML = nomesExibir
        })


        btnExibir18.addEventListener("click", () => {
            let nomesExibir = ""

            for (let i = 0; i < nomes.length; i++) {
                if(idades[i]>18) {
                    nomesExibir = `${nomesExibir} <br> ${nomes[i]}, idade ${idades[i]}`
                }
              
            }

            msg.innerHTML = nomesExibir
        })



    </Script>

</body>

</html>
