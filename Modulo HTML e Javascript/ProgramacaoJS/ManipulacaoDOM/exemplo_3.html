<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 3 - Alterar o HTML</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="header-main">
        <a href="index.html">
            <h1>Lógica de programação com Javascript</h1>
        </a>
    </header>

    <main class="main-content">
        <h2>Exemplo 3 - Alterar o HTML</h2>
        <div class="form-group">
            <label for="nome_completo">Nome completo</label>
            <input type="text" id="nome_completo" placeholder="Digite seu nome aqui...">
        </div>
        <button type="submit" id="btn_mostrar_boasvindas" class="btn success">Mostrar boas-vindas</button>
        <p id="msg"></p>
        <hr>
        <p id="titulo_alterar">Olá! Selecione uma configuração para modificar o estilo deste texto
        </p>

        <div class="form-group">
            <label for="example3">Selecione a cor do texto</label>
            <select id="opcao_cortexto">
                <option value="blue">Azul</option>
                <option value="red">Vermelho</option>
                <option value="orange">Laranja</option>
            </select>
        </div>
        <div class="form-group">
            <label for="example3">Selecione a tamanho do texto</label>
            <select id="opcao_tamanhotexto">
                <option value="12">12</option>
                <option value="14">14</option>
                <option value="16">16</option>
            </select>
        </div>
        <button type="submit" id="btn_aplicar_estilo" class="btn success">Aplicar estilo</button>
        <hr>
        <button type="submit" id="btn_mostrar_pf" class="btn success">Mostrar campo de Pessoa Física</button>
        <button type="submit" id="btn_mostrar_pj" class="btn success">Mostrar campo de Pessoa Jurídica</button>

        <div class="form-group" id="div_pf" style="display: none;">
            <label for="cpf">Digite o CPF</label>
            <input type="text" id="cpf" placeholder="Digite seu CPF aqui...">
        </div>
        
        <div class="form-group" id="div_pj" style="display: none;">
            <label for="cnpj">Digite o CNPJ</label>
            <input type="text" id="cnpj" placeholder="Digite seu CNPJ aqui...">
        </div>

    </main>

    <Script>
        const msgMostrar = document.getElementById("msg")

        const btnMostrar = document.getElementById("btn_mostrar_boasvindas")
        const btnmostrar = document.getElementById("msg")

        const btnAplicarEstilo = document.getElementById("btn_aplicar_estilo")
        const tituloAlterar = document.getElementById("titulo_alterar")

        const btnMostrarPF = document.getElementById("btn_mostrar_pf")
        const btnMostrarPJ = document.getElementById("btn_mostrar_pj")

        btnMostrar.addEventListener("click", () => {
            const nome = document.getElementById("nome_completo").value
            msgMostrar.innerHTML = `Seja bem-vindo(a) ${nome}`

        })

        btnAplicarEstilo.addEventListener("click", () => {
            const tamanho = document.getElementById("opcao_tamanhotexto").value
            const cor = document.getElementById("opcao_cortexto").value

            tituloAlterar.style.color = cor
            tituloAlterar.style.fontSize = tamanho + 'px'
        })

        btnMostrarPF.addEventListener("click", () => {
            const divPF = document.getElementById("div_pf")
            const divPJ = document.getElementById("div_pj")

            divPF.style.display = "block"
            divPJ.style.display = "none"

        } )

         btnMostrarPJ.addEventListener("click", () => {
            const divPF = document.getElementById("div_pf")
            const divPJ = document.getElementById("div_pj")

            divPJ.style.display = "block"
            divPF.style.display = "none"

        } )






    </Script>

</body>

</html>
